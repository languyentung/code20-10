<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 20/10</title>
    <meta name="description" content="Chúc mừng ngày Phụ nữ Việt Nam 20/10">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="sky"></canvas>

    <main class="scene">
        <div class="cloud-wrap">
            <div class="cloud">
                <span class="puff p1"></span>
                <span class="puff p2"></span>
                <span class="puff p3"></span>
                <span class="puff p4"></span>
            </div>
            <div class="rain"></div>
        </div>

        <section class="card">
            <p class="eyebrow">20 · 10 · 2026</p>
            <h1 class="title">Happy Women's Day</h1>
            <p class="msg">Chúc một nửa thế giới luôn xinh đẹp, hạnh phúc và rạng rỡ như những vì sao ✨</p>
            <p class="hint">Chạm vào màn hình để thả tim 💖</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
